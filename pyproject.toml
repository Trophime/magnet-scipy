[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "magnet_diffrax"
version = "0.1.0"
description = "Magnetic coupling simulation for RL circuits with adaptive PID control using scipy"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MagnetDB Team", email = "team@magnetdiffrax.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.14.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "psutil>=5.9.0",
    "black>=22.0.0",
    "ruff>=0.6.0",
    "mypy>=0.950",
    "ty>=0.0.1a20",
    "bandit[toml]>=1.7.9",
]
# Optional JAX/diffrax solver stack (not needed by the scipy-based package)
jax = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "diffrax>=0.5.0",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=2.0",
]
# Qt binding for the QtAgg matplotlib backend
gui = [
    "PySide6-Essentials>=6.5",
]
# tornado is required by the WebAgg matplotlib backend
web = [
    "tornado>=6.0",
]

[dependency-groups]
# uv-native dev group (installed by default with `uv sync`)
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "psutil>=5.9.0",
    "black>=22.0.0",
    "ruff>=0.6.0",
    "mypy>=0.950",
    "ty>=0.0.1a20",
    "bandit[toml]>=1.7.9",
]

[project.scripts]
magnet-scipy = "magnet_scipy.main_refactor:main"
magnet-scipy-coupled = "magnet_scipy.coupled_main_refactor:main"

[project.urls]
Homepage = "https://github.com/Trophime/magnet_scipy"
Repository = "https://github.com/Trophime/magnet_scipy.git"
Documentation = "https://magnet-scipy.readthedocs.io"

[tool.setuptools.packages.find]
include = ["magnet_scipy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]  
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=magnet_scipy",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "csv: marks tests that use CSV functionality",
    "plotting: marks tests that require plotting libraries",
    "performance: marks tests that measure performance",
    "jax: marks tests that require the optional jax/diffrax stack (skipped if not installed)",
]

[tool.coverage.run]
source = ["magnet_scipy"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError", 
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.old*"]

[tool.ruff.lint]
# Pyflakes + core pycodestyle errors plus import sorting, replacing flake8
# and isort. Listed explicitly so newer ruff defaults don't change results.
# Formatting is left to black.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["magnet_scipy"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "seaborn.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["magnet_scipy", "tests"]
exclude = ["**/*.old*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
